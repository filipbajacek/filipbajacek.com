<!-- JavaScript to handle click toggle -->
<script>
document.addEventListener("DOMContentLoaded", function () {
    const toggleBtn = document.getElementById("menu-toggle");
    const navbarRight = document.getElementById("navbar-right");

    toggleBtn.addEventListener("click", function () {
        navbarRight.classList.toggle("active");
        
        // Swaps hamburger icon to an 'X' icon when open
        const icon = toggleBtn.querySelector("i");
        if (navbarRight.classList.contains("active")) {
            icon.classList.remove("fa-bars");
            icon.classList.add("fa-xmark");
        } else {
            icon.classList.remove("fa-xmark");
            icon.classList.add("fa-bars");
        }
    });
});
</script>

<script>
  // Image URLs
  const images = [
    "https://drive.google.com/thumbnail?id=1WY89UKKZ37WTajKuziDfsCLCoQ9g3alC&sz=w800",
     "https://drive.google.com/thumbnail?id=14Fd4j1MRpFPdrIAqq3OE5qHg-DG9svrh&sz=w800",
     "https://drive.google.com/thumbnail?id=1OYWSfKcd_EJMzXGy8n9UrDR6EqNUqWYs&sz=w800",
     "https://drive.google.com/thumbnail?id=1HGaBKssMqRVatNVc2ppMUk9uo0KFn9dY&sz=w800",
     "https://drive.google.com/thumbnail?id=1McZgngc5k-DtlVaIBGu-50DX0EUrvfu8&sz=w800",
     "https://drive.google.com/thumbnail?id=13_yOAFTjKnfDY52cz1MVpsQB6AghX0SM&sz=w800",
     "https://drive.google.com/thumbnail?id=1-7SW5IQ7XL1BOpVkvGCE6ehsprX0fsJT&sz=w800",
     "https://drive.google.com/thumbnail?id=1UgAoR081hilLNYxsKXhrq3ysbF8HEOPq&sz=w800",
     "https://drive.google.com/thumbnail?id=1KGGOMQ7HpSpDtpFcL6V4wlMrW6fkJUAx&sz=w800",
     "https://drive.google.com/thumbnail?id=1ZT-M9ouL7EsHZtpaU-9weKsVCRWbWJ0-&sz=w800",
     "https://drive.google.com/thumbnail?id=1WJHggzQ_6i_9kVHaxAsrjc9a4xVv6kO-&sz=w800",
     "https://drive.google.com/thumbnail?id=1xwblWxVq93_hUVFVC9Mxt2brs7apfGRN&sz=w800",
     "https://drive.google.com/thumbnail?id=1q2oICo5CRvBMrYbjfOpfZ8CP2IzA-QTD&sz=w800",
  ];

  let currentIndex = 0;
  const imageElement = document.querySelector(".slider-image");
  const dotsContainer = document.querySelector(".dots-container");

  // Function to update the displayed image
  function updateImage() {
    const imageUrl = images[currentIndex];
    imageElement.src = imageUrl;
    updateDots();
  }

  // Function to create dots based on the number of images
  function createDots() {
    images.forEach((_, index) => {
      const dot = document.createElement("span");
      dot.classList.add("dot");
      dot.addEventListener("click", () => goToImage(index));
      dotsContainer.appendChild(dot);
    });
  }

  // Function to update the active dot
  function updateDots() {
    const dots = document.querySelectorAll(".dot");
    dots.forEach((dot) => dot.classList.remove("active-dot"));
    dots[currentIndex].classList.add("active-dot");
  }

  // Function to go to the next image
  function nextImage() {
    currentIndex = (currentIndex + 1) % images.length;
    updateImage();
  }

  // Function to go to the previous image
  function prevImage() {
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    updateImage();
  }

  // Function to go to a specific image
  function goToImage(index) {
    currentIndex = index;
    updateImage();
  }

  // Function to handle keyboard arrow navigation
  function handleKeyboardNavigation(event) {
    if (event.key === "ArrowRight") {
      nextImage();
    } else if (event.key === "ArrowLeft") {
      prevImage();
    }
  }

  // Initialize the slider
  function initializeSlider() {
    createDots();
    updateImage();
  }

  window.onload = initializeSlider;
</script>
