{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Write me</title>
  <link rel="stylesheet" href="{% static 'CSS+JS/form-container.css' %}">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* Full-width header styling */
    .header {
      width: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      color: white;
      text-align: center;
      height: 5vh;
      padding: 10px 0;
      font-size: 1.5em;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      /* Ensures header stays on top */
    }

    /* Body styling */
    body {
      margin: 0;
      font-family: "Arial";
      background: black;
      background-size: cover;
      display: flex;
      width: 100%;
      flex-direction: column;
      /* Ensures content is vertically stacked */
      align-items: center;
    }

    /* Heading image */
    #headingimage_mob,
    #headingimage_pc {
      display: none;
    }

    @media (max-width: 750px) {
      #headingimage_mob {
        display: block;
        width: 100%;
        height: auto;
      }
    }

    /* Show picture_2 for larger screens (screen width greater than 800px) */
    @media (min-width: 751px) {
      #headingimage_pc {
        display: block;
        width: 100%;
        height: auto;
      }
    }

    /* AUTHOR SITE */
    .text {
      background-color: rgba(256, 256, 256, 0);
      color: #e7c885;
      text-align: center;
      padding: 1%;
      font-size: 30%;
      margin-bottom: 1vh;
    }

    /* Form container styling */
    .form-container {
      background-color: black;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      width: 80vw;
      max-width: 600px;
    }

    .form-container h2 {
      color: #e7c885;
      font-size: 2.5vh;
      text-align: center;
    }

    .form-container input,
    .form-container textarea {
      width: 99%;
      padding: 1vh;
      margin: 10px 0;
      color: #000000;
      background-color: #b7ad9b;
      border: 2px solid #e7c885;
      border-radius: 5px;
      box-sizing: border-box;
    }

    .form-container button {
      width: 99%;
      padding: 1vh;
      background-color: rgba(0, 0, 0, 0);
      color: #e7c885;
      border: 2px solid #e7c885;
      border-radius: 5px;
      cursor: pointer;
      font-size: 3dvh;
    }

    .form-container button:hover {
      background-color: #e7c885;
      color: #000;
    }

    .form-container label {
      color: #e7c885;
      font-size: 2dvh;
    }

    /* Navigation bar styling */
    .navbar {
      position: fixed;
      top: 0;
      right: 5vh;
      display: flex;
      flex-direction: row;
      align-items: flex-end;
    }

    .navbar a {
      text-decoration: none;
      color: #e7c885;
      padding: 1vh 1.5dvw;
      background-color: rgba(0, 0, 0, 0);
      border: 1px solid rgba(0, 0, 0, 0);
      border-radius: 5px;
      font-size: 2dvh;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    @media (max-width: 1099px) {
      .invisible-field {
        width: 100vw;
        height: 30dvw;
        background-color: transparent;
        /* Makes the background invisible */
        opacity: 0;
        /* Makes the whole field invisible */
      }
    }

    @media (min-width: 1100px) {
      .invisible-field {
        width: 100%;
        height: 15dvw;
        background-color: transparent;
        /* Makes the background invisible */
        opacity: 0;
        /* Makes the whole field invisible */
      }
    }
  </style>

  <style>
    /* Styling for the main heading */
    h1 {
      font-size: 32px;
      /* Set the font size */
      font-weight: bold;
      /* Make it bold */
      color: #e7c885;
      /* Text color */
      text-align: center;
      /* Center-align the text */
      margin-top: 1dvw;
      margin-bottom: 1dvw;
      margin-left: 12.5dvw;
      margin-right: 12.5dvw;
    }

    /* Styling for the subheading */
    h2 {
      font-size: 22px;
      /* Smaller than h1 */
      color: #e7c885;
      text-align: center;
      /* Text color */
      margin-top: 3dvw;
      margin-bottom: 1dvw;
      margin-left: 12.5dvw;
      margin-right: 12.5dvw;
    }

    /* Styling for paragraph text */
    p {
      font-size: 16px;
      /* Font size */
      line-height: 1.6;
      /* Spacing between lines */
      color: #c0c0b7;
      text-align: justify;
      /* Text color */
      margin-top: 1dvw;
      margin-bottom: 1dvw;
      margin-left: 12.5dvw;
      margin-right: 12.5dvw;
    }
  </style>

  <style>
    /* Centering the loader */
    .loading-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 10vh;
      background-color: #000000;
    }

    /* The loader */
    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #ccc;
      /* Light gray border */
      border-top: 5px solid #333;
      /* Darker border on top */
      border-radius: 50%;
      /* Make it a circle */
      animation: spin 1s linear infinite;
    }

    /* Spinner animation */
    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    /* NAVBAR*/
/* NAVBAR*/
/* NAVBAR*/

/* NAVBAR CONTAINER ALIGNMENT */
.navbar {
    position: fixed;
    top: 1vh;
    left: 3vh;
    right: 5vh;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: transparent;
    z-index: 1000;
}

/* LEFT & RIGHT ITEM GROUPS */
.navbar_left, 
.navbar_right {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 15px;
}

/* LINK & ICON STYLING */
.navbar a {
    text-decoration: none;
    color: #e7c885;
    padding: 1vh 1.5vw;
    background-color: rgba(0, 0, 0, 0);
    border-radius: 5px;
    font-size: 2vh;
    transition: background-color 0.3s ease, color 0.3s ease;
}

.navbar a i.fa-house {
    font-size: 1.2rem;
    vertical-align: middle;
}

/* Override fixed positioning on SK link so it sits inline with the home icon */
.navbar_SK {
    position: static !important;
}

/* BASE NAVBAR LAYOUT */
.navbar {
    position: fixed;
    top: 1vh;
    left: 3vh;
    right: 5vh;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: transparent;
    z-index: 1000;
}

.navbar_left, 
.navbar_right {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 15px;
}

.navbar a {
    text-decoration: none;
    color: #e7c885;
    padding: 1vh 1.5vw;
    background-color: rgba(0, 0, 0, 0);
    border-radius: 5px;
    font-size: 2vh;
    transition: background-color 0.3s ease, color 0.3s ease;
}

/* Hide mobile toggle button on Desktop */
.menu-toggle {
    display: none;
    background: transparent;
    border: none;
    color: #e7c885;
    font-size: 1.6rem;
    cursor: pointer;
    padding: 5px;
}

/* MOBILE ADAPTATION (<= 750px) */
@media (max-width: 750px) {
    .menu-toggle {
        display: block; /* Show hamburger button on mobile */
    }

    /* Convert right links into a vertical dropdown card */
    .navbar_right {
        display: none; /* Hidden by default on mobile */
        position: absolute;
        top: 45px;
        right: 0;
        background-color: rgba(0, 0, 0, 0.95);
        border: 1px solid #e7c885;
        border-radius: 8px;
        flex-direction: column;
        align-items: flex-start;
        width: 180px;
        padding: 15px;
        gap: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
    }

    /* Display menu when activated via JS */
    .navbar_right.active {
        display: flex;
    }

    .navbar_right a {
        font-size: 1.1rem;
        width: 100%;
        padding: 6px 10px;
        box-sizing: border-box;
    }
}
  </style>
</head>

<body>
  <header class="header">
    <div class="navbar">

        <!-- Left Group: Always visible -->
        <div class="navbar_left">
            <a class="navbar_SK" href="{% url 'sk_write_us' %}" target="_self" title="Slovenčina">SK</a>
            <a class="navbar_offer" href="{% url 'en_home' %}" target="_self" title="Home" aria-label="Home">
                <i class="fa-solid fa-house"></i>
            </a>
        </div>

        <!-- Mobile Hamburger Toggle Button (Hidden on PC) -->
        <button id="menu-toggle" class="menu-toggle" type="button" aria-label="Toggle navigation">
            <i class="fa-solid fa-bars"></i>
        </button>

        <!-- Right Group: Displays normally on PC, toggles on mobile -->
        <div id="navbar-right" class="navbar_right">
            <a class="navbar_offer" href="{% url 'en_gallery' %}" target="_self">Gallery</a>
            <a class="navbar_author" href="{% url 'en_author' %}" target="_self">Author</a>
            <a class="navbar_offer" href="{% url 'en_write_us' %}" target="_self">Write me</a>
            <a class="navbar_offer" href="https://payhip.com/filipbajacek" target="_self">Shop</a>
        </div>

    </div>
</header>

<!-- JavaScript to handle click toggle -->
<script>
document.addEventListener("DOMContentLoaded", function () {
    const toggleBtn = document.getElementById("menu-toggle");
    const navbarRight = document.getElementById("navbar-right");

    toggleBtn.addEventListener("click", function () {
        navbarRight.classList.toggle("active");
        
        // Swaps hamburger icon to an 'X' icon when open
        const icon = toggleBtn.querySelector("i");
        if (navbarRight.classList.contains("active")) {
            icon.classList.remove("fa-bars");
            icon.classList.add("fa-xmark");
        } else {
            icon.classList.remove("fa-xmark");
            icon.classList.add("fa-bars");
        }
    });
});
</script>

  <!-- Image element with adjusted styling -->
  <div>
    <img id="headingimage_pc" src="https://drive.google.com/thumbnail?id=1OudeTvYL9LgMD7fqy4P7se5ejXaOov0P&sz=w1600"
      alt="Something went wrong" />
    <img id="headingimage_mob" src="https://drive.google.com/thumbnail?id=1XXvFirFlM-N3MwRAUfmEwhiy5D2Io8wn&sz=w1200"
      alt="Something went wrong" />
  </div>

  <h2>
    Do you have something to ask or tell me? Then write me here. I will be
    grateful for all your questions and comments.
  </h2>

  <div class="form-container">
    <div class="text"></div>

    <form action="https://formsubmit.co/45865a999103601872e05c5ba84f18b4" method="POST">
      <label for="email">Your email:</label>
      <input type="email" name="email" required placeholder="Enter your email" />

      <div class="text"></div>

      <label for="message">Your message:</label>
      <textarea id="message" name="message" required rows="4" placeholder="Write your message"></textarea>

      <input type="hidden" name="_captcha" value="false" />
      <input type="hidden" name="_next" value="https://filipbajacek.com/EN/thankyousite.html" />
        <input type="hidden" name="_url" value="https://fbwildlife.onrender.com/write us.html">
      <input type="hidden" name="_template" value="table" />
      <input type="hidden" name="_subject" value="Write us" />
      <button type="submit" id="sendButton">Send</button>
    </form>
    <div id="statusMessage">
      <div class="loading-container">
        <div class="spinner"></div>
      </div>
      SENDING
    </div>
  </div>

  <style>
    /* Message styling */
    #statusMessage {
      font-size: 22px;
      /* Smaller than h1 */
      color: #e7c885;
      text-align: center;
      /* Text color */
      margin-top: 3dvw;
      margin-bottom: 1dvw;
      margin-left: 12.5dvw;
      margin-right: 12.5dvw;
      opacity: 0;
      /* Fully visible initially */
      transition: opacity 0.5s ease;
      /* Smooth transition */
    }
  </style>

 {% include "EN/footer.html" %}
</body>

<script>
  const button = document.getElementById("sendButton");
  const statusMessage = document.getElementById("statusMessage");

  // Add click event listener to the button
  button.addEventListener("click", () => {
    // Change the transparency of the message
    statusMessage.style.opacity = "1";
  });
</script>

</html>
